name: check-skeleton
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.3
      # The repository is public: nothing but the skeleton may be in it.
      - run: python scripts/check_public.py
      - run: python scripts/test_check_public.py
      # No live/ on GitHub: this checks the skeleton (conventions, templates) only.
      - run: python scripts/check_vault.py
      - run: python scripts/test_check_vault.py
      - run: python scripts/test_notes_flow.py
      - run: python scripts/test_consolidate_resolve.py
      - run: python scripts/test_paper_text.py
      - run: python scripts/test_build_software.py
