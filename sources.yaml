# What the vault indexes besides its own notes.
# Code repositories are cloned read-only by scripts/setup.sh at the pinned commit.
# Raise a pin by pull request; lessons with `applies_to: repo:<name>@<old commit>`
# are then flagged for review by the checker.

repositories:
  - name: orblet
    url: https://github.com/saharsh1/orblet
    commit: ac3eeb7590cd   # 2026-10-22
    index: [src, docs, notebooks, README.md]
  - name: SPARTA
    url: https://github.com/SPARTA-dev/SPARTA
    commit: e6ce5f4fa898   # 2026-10-20
    index: [src, packages, docs, examples, README.md, KNOWN_TRAPS.md]   # code and docs only, not data
  - name: sedkit
    url: https://github.com/jiadonglee/spbin   # renamed from sedkit on GitHub
    commit: dfda53401e9c   # 2026-10-01
    index: [src, docs, examples, README.md]

  - name: gaiamock
    url: https://github.com/kareemelbadry/gaiamock
    commit: 5c3c006b0906   # 2026-11-09
    index: [src, docs, tools, README.md]   # restructured as a package by 2026-11; not data/
  - name: GaiamockWrapper
    url: https://github.com/BenPennell/GaiamockWrapper
    commit: 68e2280c48b7   # 2026-10-21, MIT
    index: [Wrapper, readme.md, "1)SimpleExamples.ipynb", "2)LightPopsynthExample.ipynb", "3)BHCompanionsExample.ipynb"]   # not data/

# Gaia releases. scripts/build/ fetches each file from its public URL, checks its
# SHA-256, stores it in keeper/data/gaia/<label>/ with a lock, and builds the parsed data
# model (keeper/parsed/gaia/<label>/) and the generated notes (keeper/generated/gaia/<label>/).
# A draft is replaced by the formal release: add the formal entry, rebuild, then remove
# the draft entry and its folders.
gaia:
  - label: DR4-draft
    release: DR4
    status: draft
    replaced_by: "DR4: the formal data model and documentation, at the release (planned 2026-12-02)"
    doc_version: "draft 2026-06-26"
    page: https://www.cosmos.esa.int/web/gaia/dr4
    public: "yes - offered for anonymous download on https://www.cosmos.esa.int/web/gaia/dr4 (#datamodel); checked 2026-11-11, 2026-11-12, 2026-11-13. Licence: https://www.cosmos.esa.int/web/gaia-users/license"
    datamodel:
      zip: https://anonftp.cosmos.esa.int/pub/GAIA_PUBLIC_DATA/Gaia_DR4/dr4-prerelease/gaia-dr4-prerelease-draft-data-model_2026-06-26.zip
      sha256: d807eae98acbeec0a0af2ce6a5d7d352298df6f270a1f13207cc8d1becf42c66
      pdf: gaia-dr4-prerelease-draft-data-model.pdf
    prerelease_data:   # not built yet
      - zip: https://anonftp.cosmos.esa.int/pub/GAIA_PUBLIC_DATA/Gaia_DR4/dr4-prerelease/gaia-dr4-prerelease-epoch-astrometry_2026-06-26.zip
        note: "epoch astrometry of 12 sources, https://www.cosmos.esa.int/web/gaia/dr4-prerelease"
  - label: DR3
    release: DR3
    status: formal
    doc_version: "1.3 (2023-07-10)"
    page: https://www.cosmos.esa.int/web/gaia/dr3
    public: "yes - released 2022-06-13"
    documentation:     # scripts/build/gaia_docs.py DR3
      html: https://gea.esac.esa.int/archive/documentation/GDR3/
      datamodel_path: Gaia_archive/chap_datamodel/
      pdf: https://gea.esac.esa.int/archive/documentation/GDR3/pdf/GaiaDR3_documentation_1.3.pdf   # 185 MB; not used
    archive_columns:   # the archive's own column list (gaia_docs.py --tap), to check the parsed data model against
      tap: https://gea.esac.esa.int/tap-server/tap
      query: "SELECT table_name, column_name, datatype, unit, ucd, description FROM tap_schema.columns WHERE table_name LIKE 'gaiadr3.%'"

papers: []   # arXiv ids; filled by the paper importer
